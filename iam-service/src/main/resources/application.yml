spring:
  application:
    name: iam-service
  profiles:
    active: dev
  cloud:
    config:
      uri: ${CONFIG_SERVER_URL:http://localhost:8888}
      fail-fast: false
      retry:
        max-attempts: 5
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
# Thêm cái này để chắc chắn log hiện đúng tên kể cả khi chưa kịp lấy config từ server
logging:
  pattern:
    level: "%5p [iam-service]"