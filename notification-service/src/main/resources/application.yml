server:
  # Cổng kết nối HTTP của Enrollment Service (HTTP Port)
  port: 8006

spring:
  application:
    name: enrollment-service
  config:
    import: "optional:configserver:http://localhost:8888"
  datasource:
    url: jdbc:mysql://localhost:3306/enrollment_db?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:admin}
    password: ${RABBITMQ_PASSWORD:admin123}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: "*"

# App Custom Configs
app:
  redis:
    key-prefix: "enrollment:"
  rabbitmq:
    queue:
      order-completed: "enrollment-order-completed-queue"
    exchange:
      order: "order-exchange"
    routing-key:
      order-completed: "order.completed"

lms:
  rabbitmq:
    enrollment:
      exchange: lms.order.exchange
      queue: enrollment.order.completed.queue
      routing-key: order.completed
      dlq: enrollment.order.completed.queue.dlq  # Dead Letter Queue

application:
  security:
    # Khóa bảo mật xác thực liên dịch vụ nội bộ (Microservice Internal Key)
    internal-key: ${INTERNAL_KEY:my-secret-internal-key}

resilience4j:
  circuitbreaker:
    instances:
      iam-service:
        sliding-window-size: 10
        failure-rate-threshold: 50        # 50% lỗi → mở circuit
        wait-duration-in-open-state: 10s  # Chờ 10s trước khi thử lại
        permitted-number-of-calls-in-half-open-state: 3

