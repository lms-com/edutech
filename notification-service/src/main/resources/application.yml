server:
  # Cổng kết nối HTTP của Notification Service (HTTP Port)
  port: 8008

spring:
  application:
    name: notification-service
  config:
    import: "optional:configserver:http://localhost:8888"
  datasource:
    url: jdbc:mysql://localhost:3306/notification_db?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:admin}
    password: ${RABBITMQ_PASSWORD:admin123}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: "*"

# App Custom Configs
app:
  redis:
    key-prefix: "notification:"

# Cấu hình RabbitMQ dành riêng cho Notification Service
# Các giá trị này khớp với hằng số trong RabbitMQConfig.java
lms:
  rabbitmq:
    notification:
      exchange: lms.iam.exchange
      queue:
        otp: lms.notification.queue.auth.otp
      routing-key:
        otp: auth.email.send_otp

application:
  security:
    # Khóa bảo mật xác thực liên dịch vụ nội bộ (Microservice Internal Key)
    internal-key: ${INTERNAL_KEY:my-secret-internal-key}

resilience4j:
  circuitbreaker:
    instances:
      iam-service:
        sliding-window-size: 10
        failure-rate-threshold: 50        # 50% lỗi → mở circuit
        wait-duration-in-open-state: 10s  # Chờ 10s trước khi thử lại
        permitted-number-of-calls-in-half-open-state: 3

