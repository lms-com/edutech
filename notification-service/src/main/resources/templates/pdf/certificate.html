<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <title>Chứng Chỉ Hoàn Thành</title>
    <style>
        @page {
            size: A4 landscape;
            margin: 10mm;
        }

        body {
            font-family: 'Roboto', Arial, sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 0;
        }

        .certificate-container {
            border: 15px double #2c3e50;
            padding: 30px;
            box-sizing: border-box;
            background-color: #fcfcfc;
            text-align: center;
            height: 180mm; /* Khít với chiều cao A4 landscape trừ lề */
            position: relative;
        }

        .header {
            font-size: 36px;
            color: #2c3e50;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 15px;
        }

        .sub-header {
            font-size: 16px;
            color: #7f8c8d;
            margin: 15px 0;
        }

        .learner-name {
            font-size: 32px;
            color: #e74c3c;
            font-weight: bold;
            text-decoration: underline;
            margin: 15px 0;
        }

        .course-title {
            font-size: 24px;
            color: #2c3e50;
            font-style: italic;
            font-weight: bold;
            margin: 15px 0;
        }

        .footer-section {
            margin-top: 35px;
            display: table;
            width: 100%;
        }

        .footer-col {
            display: table-cell;
            vertical-align: middle;
        }

        .qr-code {
            width: 100px;
            height: 100px;
        }

        .issue-date {
            font-size: 14px;
            color: #7f8c8d;
            text-align: left;
        }

        .signature {
            font-size: 16px;
            font-weight: bold;
            color: #2c3e50;
            border-top: 1px solid #7f8c8d;
            display: inline-block;
            padding-top: 5px;
            width: 220px;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="certificate-container">
        <div class="header">CHỨNG CHỈ HOÀN THÀNH</div>
        <div class="sub-header">Chứng nhận học viên</div>
        <div class="learner-name" th:text="${learnerName}">Nguyễn Văn A</div>
        <div class="sub-header">Đã hoàn thành xuất sắc khóa học</div>
        <div class="course-title" th:text="${courseTitle}">Lập trình Java Spring Boot</div>

        <div class="footer-section">
            <!-- Cột trái: Ngày cấp & Mã xác thực -->
            <div class="footer-col" style="text-align: left; width: 35%; padding-left: 20px;">
                <p class="issue-date">
                    <strong>Ngày cấp:</strong> <span th:text="${issuedAt}">17/06/2026</span><br />
                    <strong>Mã xác thực:</strong> <span th:text="${qrCodeHash}">CERT-8888-9999-AAAA</span>
                </p>
            </div>

            <!-- Cột giữa: QR Code xác thực -->
            <div class="footer-col" style="text-align: center; width: 30%;">
                <img th:src="'data:image/png;base64,' + ${qrCodeBase64}" class="qr-code"
                    alt="QR Code Verification" />
            </div>

            <!-- Cột phải: Chữ ký ban giám đốc -->
            <div class="footer-col" style="text-align: right; width: 35%; padding-right: 20px; vertical-align: bottom;">
                <div class="signature">Ban Giám Đốc EDUTECH</div>
            </div>
        </div>
    </div>
</body>

</html>
