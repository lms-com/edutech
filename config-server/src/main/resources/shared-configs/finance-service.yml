server:
  port: 8005
  forward-headers-strategy: framework

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/finance_db?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline_on_migrate: true
    table: flyway_schema_history
    clean-disabled: false
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:admin}
    password: ${RABBITMQ_PASSWORD:admin123}
    listener:
      simple:
        default-requeue-rejected: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true


resilience4j:  # Thêm cái này để bắt cac lỗi trong gọi internal api và trả về giá trị do fallback thiết lập sẵn để tránh sập hệ thống khi một service sập
  circuitbreaker:
    configs:
      default:
        record-exceptions:
          - feign.FeignException

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: "*"

application:
  security:
    internal-key: RI8w5frC3fEGD+Cmr9g1FZta3bLmEkHGQULvCya83Uo=
  timezone: Asia/Ho_Chi_Minh
  finance:
    refund-deadline: 7  # Hạn Refund là 7 ngày
  cron:
    balance-settlement: "0 */1 * * * *"   # mỗi ngày một lần lúc 0 giờ

springdoc:
  api-docs:
    path: /v3/api-docs

