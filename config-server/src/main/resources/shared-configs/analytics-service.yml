server:
  port: 8010

spring:
  main:
    lazy-initialization: false
  datasource:
    url: "jdbc:mysql://localhost:3306/analytics_db?createDatabaseIfNotExist=true&useUnitCode=true&characterEncoding=UTF-8"
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
      show-sql: false
      properties:
        hibernate:
          format_sql:  true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline_on_migrate: true
    table: flyway_schema_history
    clean-disabled: false

  rabbitmq:
    host: localhost #${RABBITMQ_HOST:localhost}
    port: 5672 #${RABBITMQ_PORT:5672}
    username: admin #${RABBITMQ_USERNAME:admin}
    password: admin123 #${RABBITMQ_PASSWORD:admin123}
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2000ms
          max-interval: 10000ms
          multiplier: 2.0
        default-requeue-rejected: false   # Rất quan trọng: false để ném vào DLX thay vì kẹt lại hàng đợi gốc

  data:
    redis:
      host: localhost
      port: 6379

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

springdoc:
  api-docs:
    path: /v3/api-docs

application:
  timezone: ${TIMEZONE:Asia/Ho_Chi_Minh}