server:
  port: 8004

spring:
  datasource:
    username: root
    password: 1234
    url: "jdbc:mysql://localhost:3306/order_db?createDatabaseIfNotExists=True&useSSL=False"
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    table: flyway_schema_history
    clean-disabled: false

  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: admin123

  cloud:
    openfeign:
      circuitbreaker:
        enabled: true

application:
  security:
    internal-key: RI8w5frC3fEGD+Cmr9g1FZta3bLmEkHGQULvCya83Uo=

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/