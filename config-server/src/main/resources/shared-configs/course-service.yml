server:
  port: 8002

spring:
  datasource:
    url: "jdbc:mysql://localhost:3306/course_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true"
    username: "root"
    password: "1234"
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    table: flyway_schema_history

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/