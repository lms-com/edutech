server:
  port: 8003

minio:
  uri: http://localhost:9000
  access-key: admin
  secret-key: admin123
  bucket-name: lms-media-bucket

spring:
  datasource:
    url: "jdbc:mysql://localhost:3306/media_db?createDatabaseIfNotExists=True&useSSL=False"
    username: "root"
    password: "1234"
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline_on_migrate: true
    table: flyway_schema_history
    clean-disabled: false