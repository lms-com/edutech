server:
  port: 8001

spring:
  datasource:
    url: "jdbc:mysql://localhost:3306/iam_db?createDatabaseIfNotExists=true&useSSL=false"
    username: "root"
    password: "1234"
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline_on_migrate: true
    table: flyway_schema_history

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/