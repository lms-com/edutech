server:
  port: 8001
  forward-headers-strategy: framework

spring:
  datasource:
    url: "jdbc:mysql://localhost:3306/iam_db?createDatabaseIfNotExist=true&useSSL=false"
    username: "root"
    password: "1234"
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline_on_migrate: true
    table: flyway_schema_history
    clean-disabled: false

  data:
    redis:
      host: localhost
      port: 6379


eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

application:
  security:
    internal-key: "my-secret-internal-key"
    jwt:
      secret-key: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      expiration: 86400000 # 1 ngay = 86.400.000 ms
      refresh-token:
        expiration: 604800000 # 7 ngay = 604.800.000 ms

springdoc:
  api-docs:
    path: /v3/api-docs