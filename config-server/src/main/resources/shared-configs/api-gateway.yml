server:
  port: 8080

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: iam-service
          uri: lb://iam-service
          predicates:
            - Path=/iam-service/api/v1/auth/**, /iam-service/api/v1/user/**, /iam-service/api/v1/admin/**, /iam-service/v3/api-docs, /iam-service/v3/swagger-ui.html
          filters:
            - StripPrefix=1
        - id: config-server
          uri: lb://config-server
          predicates:
            - Path=/config-server/**
            - RemoteAddr=127.0.0.1/32
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            maxAge: 3600
  data:
    redis:
      host: localhost
      port: 6379

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: "*" # "refresh,health,info,env"

application:
  security:
    jwt:  # Luu secret-key de decode Token
      secret-key: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970

springdoc:
  swagger-ui:
    path: /swagger-ui.html    # URL cua Swagger UI tren Gateway
    urls:
      - name: 01. IAM Service
        url: /iam-service/v3/api-docs  # phan route den service phai dung voi khai bao tren spring.cloud.gateway.routes
      - name: 02. Course Service
        url: /course-service/v3/api-docs
      # Tuong tu cho cac Service khac ...

  api-docs:
    path: /v3/api-docs