server:
  port: 8080

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: iam-service
          uri: lb://iam-service
          predicates:
            - Path=/api/v1/auth/**, /api/v1/user/**, /api/v1/admin/**
        - id: config-server
          uri: lb://config-server
          predicates:
            - Path=/config-server/**
            - RemoteAddr=127.0.0.1/32
          filters:
            - StripPrefix=1

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: "refresh,health,info,env"

springdoc:
  swagger-ui:
    path: /swagger-ui.html    # URL cua Swagger UI tren Gateway
    urls:
      - name: 01. IAM Service
        url: /iam-service/v3/api-docs  # phan route den service phai dung voi khai bao tren spring.cloud.gateway.routes
      - name: 02. Course Service
        url: /course-service/v3/api-docs
      # Tuong tu cho cac Service khac ...

  api-docs:
    path: /v3/api-docs