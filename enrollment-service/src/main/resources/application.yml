server:
  port: 8086

spring:
  application:
    name: enrollment-service
  config:
    import: "optional:configserver:http://localhost:8888"
  datasource:
    url: jdbc:mysql://localhost:3306/enrollment_db?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: "*"

# App Custom Configs
app:
  redis:
    key-prefix: "enrollment:"
  rabbitmq:
    queue:
      order-completed: "enrollment-order-completed-queue"
    exchange:
      order: "order-exchange"
    routing-key:
      order-completed: "order.completed"

lms:
  rabbitmq:
    enrollment:
      exchange: lms.order.exchange
      queue: enrollment.order.completed.queue
      routing-key: order.completed
      dlq: enrollment.order.completed.queue.dlq  # Dead Letter Queue
