# Cấu hình các biến cho VNPAY dùng trong lúc test
vnpay:
  hash-secret: GLRQMIUPFAFOCVECZWVQYCBORJRXOKWE # Chuỗi secret giả lập để test mã hóa

# Tắt kết nối tới DB thật, dùng DB trong bộ nhớ (H2) hoặc tắt hoàn toàn nếu chỉ Mock
spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  rabbitmq:
    listener:
      simple:
        default-requeue-rejected: false
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
